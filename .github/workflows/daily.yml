name: Price update

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, so busy days aren't missed on the public feed
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch and parse posts
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_WAIT: "1200"   # wait up to 20 minutes for Claude; anything later is collected next run
        run: python run_daily.py

      - name: Save results
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Price update"
          git pull --rebase
          git push
